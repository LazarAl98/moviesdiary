<ion-header>
  <ion-toolbar>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <ion-grid>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-input
              type="text"
              formControlName="name"
              label="Name"
              labelPlacement="floating"
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-input
              type="email"
              formControlName="email"
              label="Email"
              labelPlacement="floating"
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>

      @if (registerForm.get('email')!.invalid &&
      registerForm.get('email')!.touched) {
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <p>Unesi ispravnu email adresu.</p>
        </ion-col>
      </ion-row>
      }

      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-input
              type="password"
              formControlName="password"
              label="Password"
              labelPlacement="floating"
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>

      @if (registerForm.get('password')!.invalid &&
      registerForm.get('password')!.touched) {
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <p>Minimum 7 karaktera.</p>
        </ion-col>
      </ion-row>
      }

      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-button
            type="submit"
            color="primary"
            expand="block"
            [disabled]="registerForm.invalid"
            >Register</ion-button
          >
        </ion-col>
      </ion-row>

      <ion-row class="ion-justify-content-center ion-text-center">
        <ion-col size-sm="6">
          <a routerLink="/log-in">Već imaš nalog? Prijavi se</a>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
